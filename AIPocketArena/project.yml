name: AIPocketArena
options:
  bundleIdPrefix: com.chetanbavdhankar
targets:
  AIPocketArena:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AIPocketArena
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_FILE: AIPocketArena/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AIPocketArenaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AIPocketArenaTests
    dependencies:
      - target: AIPocketArena
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
